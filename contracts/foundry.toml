[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
# rendering all 1,031 SVGs in one test needs far more than a block
gas_limit = "18446744073709551615"
memory_limit = 2147483648
remappings = ["solady/=lib/solady/src/", "forge-std/=lib/forge-std/src/"]
# the packed art and the 2021 twins come from ../data; rendered SVGs go to ./render for the pixel check
fs_permissions = [{ access = "read", path = "../data" }, { access = "read-write", path = "./render" }]

# the whole night, played at random: 64 nights of 150 moves each
[invariant]
runs = 64
depth = 150
